# Copy to ~/.config/herdr-auto-resume/config.yaml and edit as needed.
# version is required; unknown keys are rejected.
version: 1

# Runtime adapter and Herdr connection.
# type: herdr
# transport: socket  # explicit; omit for the built-in Herdr socket default
# herdr_bin: herdr
# socket: ~/.config/herdr/herdr.sock
# workspace: your-workspace
runtime:
  # type: herdr
  # transport: socket
  # herdr_bin: herdr
  # socket: ~/.config/herdr/herdr.sock
  # workspace: your-workspace

# Panes are monitored explicitly. Repeat pane IDs as needed.
monitoring:
  # panes:
  #   - w1:p1
  #   - w2:p1
  # interval: 3s
  # lines: 200
  # wait_for_panes: false  # retry transient startup reachability and zero matches
  # admit_session_matches: false  # requires providers.session_file_channel
  # admit_agent_events: false  # Herdr socket only; herdr's agent detection defines
  #                            # coverage instead of the pane list above. Seeds from
  #                            # the startup snapshot and follows pane.agent_detected.

# Safety margins and wait bounds.
resume:
  # margin: 60s
  # max_wait: 192h
  # verify_timeout: 90s
  # answer_limit_menu: false  # Herdr only; requires persistent state

# Provider detection and continuation prompts.
providers:
  # enabled:
  #   - claude
  #   - codex
  # claude_prompt: continue
  # codex_prompt: Continue the previous task from where you stopped.
  # session_file_channel: false  # Herdr only; requires persistent state

# Persistent job state. Use off to disable persistence and the run lock.
state:
  # file: auto
